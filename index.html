<div class="stats"><div class="stat"><span class="muted tiny">Official-source starting programs</span><strong>${PROGRAMS.length}</strong></div><div class="stat"><span class="muted tiny">Products you're tracking</span><strong>${state.products.length}</strong></div><div class="stat"><span class="muted tiny">Reports saved on this device</span><strong>${state.reports.length}</strong></div></div>
<div class="callout gold box-top">${icon('info')} <b>What is live?</b> The links to official programs are real. This personal edition does <b>not</b> automatically pull product prices or email daily digests; your recorded prices and reports stay on this device. We show no invented sale prices.</div>
<div class="section-head"><h2>Verified program starting points</h2><button class="btn small ghost" onclick="setView('directory')">View all ${PROGRAMS.length} ${icon('external')}</button></div><div class="grid">${featured.map(programCard).join('')}</div>
<div class="section-head"><h2>Quick tools</h2></div><div class="grid">${quickCard('🧮','Veteran price calculator','Enter a real listing price and see potential savings.','proof')}${quickCard('📍','Local store lookup','Search official programs and find businesses by ZIP.','directory')}${quickCard('📝','Report what you find','Record missing discounts, wrong prices, or expired offers.','reports')}</div>`}
function quickCard(em,title,desc,v){return `<button class="card" style="text-align:left;color:inherit;width:100%" onclick="setView('${v}')"><div style="font-size:28px;margin-bottom:12px">${em}</div><div style="font-size:15px;font-weight:800">${title}</div><p class="small muted">${desc}</p><span class="accent tiny" style="font-weight:800">Open →</span></button>`}
function programCard(p){let saved=state.favorites.includes(p.id);let stale=(Date.now()-new Date(p.verified+'T12:00:00Z').getTime())>45*86400000;return `<article class="card"><div class="program-head"><div class="row" style="justify-content:flex-start"><div class="merchant-icon">${p.icon}</div><div><div class="program-name">${esc(p.name)}</div><div class="category">${esc(p.category)} · ${esc(p.channel)}</div></div></div><span class="pill ${stale?'warn':'good'}">${stale?'Recheck':'✓ Source'}</span></div><div class="offer">${esc(p.offer)}</div><p class="program-desc">${esc(p.desc)}</p><div class="badge-bar"><span class="pill">Eligibility applies</span><span class="pill ${p.stack==='no'?'warn':''}">${p.stack==='no'?'No stacking':'Stacking unknown'}</span></div><div class="card-end"><button class="btn small ghost" onclick="openProgram('${p.id}')">Details & claim ${icon('external')}</button><button class="icon-btn ${saved?'saved':''}" onclick="toggleFav('${p.id}')" aria-label="${saved?'Remove from':'Save to'} favorites">${saved?'♥':'♡'}</button></div></article>`}
function toggleFav(id){const n=state.favorites.indexOf(id);if(n>=0)state.favorites.splice(n,1);else state.favorites.push(id);save();render();notify(n>=0?'Removed from saved deals':'Saved to My Vault')}
function directory(){let categories=['All','Tech','Clothing','Home','Wireless','Travel','Outdoors'];let results=PROGRAMS.filter(p=>(filter==='All'||filter===p.category)&&(`${p.name} ${p.category} ${p.offer} ${p.desc} ${p.eligible}`.toLowerCase().includes(query.toLowerCase())));return `<div class="eyebrow">National veteran-discount directory</div><h1 style="margin:8px 0 4px;letter-spacing:-.03em">Find veteran discounts</h1><p class="subtitle">Search documented retailer programs. For stores not listed, use the official lookup or record what you found.</p><div class="searchbar"><input id="dirQuery" placeholder="Search Apple, Nike, electronics, hardware, hotels..." value="${esc(query)}" aria-label="Search discounts"></div><div class="filters" id="filters">${categories.map(x=>`<button class="chip ${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="row" style="margin:8px 0 15px"><span class="quiet" id="resultCount">${results.length} documented programs</span><button class="btn small ghost" onclick="startReport('missing')">${icon('plus')} Report missing store</button></div><div id="results" class="grid">${results.length?results.map(programCard).join(''):noResults()}</div><div class="callout box-top"><b>Looking for a local store?</b> Search for the business and your ZIP in Google Maps. A location appearing on a map does not prove it offers a veteran discount. <div class="formgrid" style="margin-top:12px"><div class="field"><label for="localMerchant">Store or service</label><input id="localMerchant" placeholder="e.g. auto repair, local restaurant"></div><div class="field"><label for="localZip">City or ZIP</label><input id="localZip" value="${esc(state.zip)}" placeholder="e.g. 36867"></div></div><button class="btn small ghost" onclick="nearSearch()">${icon('map')} Find businesses on Maps</button></div>`}
function noResults(){return `<div class="empty" style="grid-column:1/-1"><div class="big">🔎</div><strong>No matching discount listed yet</strong><p>That does not mean the store has no veteran offer. Search the store's official policy or record a missing discount.</p><div class="actions" style="justify-content:center"><button class="btn small ghost" onclick="officialSearch()">Search official sites ${icon('external')}</button><button class="btn small primary" onclick="startReport('missing')">Report a deal</button></div></div>`}
function officialSearch(){window.open('https://www.google.com/search?q='+encodeURIComponent((query||'veterans discount')+' military veteran discount official site'),'_blank','noopener,noreferrer')}
function nearSearch(){const m=$('localMerchant')?.value.trim()||'stores';const z=$('localZip')?.value.trim()||'';state.zip=z;save();window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(m+' near '+z),'_blank','noopener,noreferrer')}
function initView(){if(view==='directory'){const e=$('dirQuery');e?.addEventListener('input',ev=>{query=ev.target.value;renderResults()});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;renderFilters()}))}if(view==='proof'){renderCalc();$('calcForm').addEventListener('input',renderCalc);$('calcForm').addEventListener('change',renderCalc)}if(view==='reports'){$('reportForm').addEventListener('submit',submitReport)}if(view==='vault')renderDigest()}
function renderFilters(){document.querySelectorAll('[data-filter]').forEach(e=>e.classList.toggle('active',e.dataset.filter===filter));renderResults()}
function renderResults(){const r=PROGRAMS.filter(p=>(filter==='All'||p.category===filter)&&(`${p.name} ${p.category} ${p.offer} ${p.desc} ${p.eligible}`.toLowerCase().includes(query.toLowerCase())));$('resultCount').textContent=r.length+' documented programs';$('results').innerHTML=r.length?r.map(programCard).join(''):noResults()}
function openProgram(pid){const p=PROGRAMS.find(x=>x.id===pid);if(!p)return;let hasCalc=p.rate!==null;modal(`<div class="row" style="justify-content:flex-start;margin-bottom:12px"><div class="merchant-icon" style="width:62px;height:62px;font-size:32px">${p.icon}</div><div><div class="eyebrow">Official merchant program</div><h2 style="margin:2px 0">${esc(p.name)}</h2></div></div><div class="row"><span class="value gold" style="font-size:27px">${esc(p.offer)}</span><span class="pill good">Source checked ${day(p.verified)}</span></div><p class="small muted">${esc(p.desc)}</p><hr class="divide"><b>Who qualifies</b><p class="small muted">${esc(p.eligible)}</p><b>How to claim it</b><p class="small muted">${esc(p.claim)}</p><b>Important conditions</b><p class="small muted">${esc(p.terms)}</p><div class="callout">Listed source documents the merchant's <b>program</b>, not the price or eligibility of any specific product. ${p.stack==='no'?'This merchant specifically restricts stacking.':'Stacking is not confirmed.'} Final eligibility and totals are determined at retailer checkout.</div><div class="actions"><a class="btn primary" target="_blank" rel="noopener noreferrer" href="${esc(p.url)}">${icon('external')} Open official merchant page</a>${hasCalc?`<button class="btn ghost" onclick="preselectCalc('${p.id}')">${icon('chart')} Estimate item price</button>`:''}<button class="btn ghost" onclick="toggleFav('${p.id}');closeModal()">${state.favorites.includes(pid)?'Remove saved':'Save store'}</button></div>`)}
function preselectCalc(pid){closeModal();setView('proof');$('cpStore').value=pid;$('cpDiscount').value=String(PROGRAMS.find(p=>p.id===pid).rate);renderCalc()}
function modal(html){$('modalHost').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="Details"><button class="icon-btn close" onclick="closeModal()" aria-label="Close">${icon('close')}</button>${html}</section></div>`}
function closeModal(){$('modalHost').innerHTML=''}
function proof(){return `<div class="eyebrow">Truth before checkout</div><h1 style="margin:8px 0 4px;letter-spacing:-.03em">Veteran price checker</h1><p class="subtitle">Use a price you actually see at a retailer. We calculate possible savings and record the price history you observe—no invented Black Friday charts.</p><div class="two"><section class="card"><h2 style="margin:0 0 17px">Calculate & save an item</h2><form id="calcForm" onsubmit="return false"><div class="field"><label>Product name / exact model</label><input id="cpName" placeholder="e.g. Lenovo Legion RTX 5070 Ti, SKU ..."></div><div class="formgrid"><div class="field"><label>Retailer program</label><select id="cpStore"><option value="">Custom retailer / none</option>${PROGRAMS.map(p=>`<option value="${p.id}">${esc(p.name)}${p.rate!==null?' ('+p.rate+'%)':''}</option>`).join('')}</select></div><div class="field"><label>Retailer listing price ($)</label><input id="cpPrice" type="number" min="0" step="0.01" placeholder="2199.00"></div><div class="field"><label>Veteran percentage (%)</label><input id="cpDiscount" type="number" min="0" max="100" step="0.01" placeholder="5"></div><div class="field"><label>Past observed price ($, optional)</label><input id="cpOld" type="number" min="0" step="0.01" placeholder="Previous actual selling price"></div></div><div class="formgrid"><div class="field"><label>Can the discount stack?</label><select id="cpStack"><option value="unknown">Unknown — conditional only</option><option value="yes">Yes — retailer confirmed</option><option value="no">No — don't apply to sale</option></select></div><div class="field"><label>Product page URL (optional)</label><input id="cpUrl" type="url" placeholder="https://retailer.com/item..."></div></div><div class="field"><label>Notes (optional)</label><input id="cpNotes" placeholder="Exact SKU, exclusions, coupon conditions..."></div></form><div class="actions"><button class="btn primary" onclick="saveProduct()">${icon('plus')} Save product & price</button><button class="btn ghost" onclick="findPrices()">Search live listings ↗</button><button class="btn ghost" onclick="resetCalc()">Clear</button></div></section><section><div class="quote" id="calcResult"></div><div class="callout box-top"><b>We never apply discounts blindly.</b> “Yes” for stacking must come from the retailer. If unknown, the app displays a conditional estimate, not a guaranteed checkout price. Calculations exclude taxes, shipping, caps, and ineligible items.</div></section></div><div class="section-head"><h2>Your tracked items</h2><span class="quiet">${state.products.length} product records · stored on this device</span></div><div id="productList">${productsHtml()}</div>`}
function calcInput(){return {name:$('cpName').value.trim(),store:$('cpStore').value,price:$('cpPrice').value,rate:$('cpDiscount').value,old:$('cpOld').value,stack:$('cpStack').value,url:$('cpUrl').value.trim(),notes:$('cpNotes').value.trim()}}
function renderCalc(){const f=calcInput();const pr= dollars(f.price);const rate=Number(f.rate);const validRate=f.rate!==''&&rate>=0&&rate<=100&&Number.isFinite(rate);const perc=validRate?Math.round(pr*rate/100):0;const old=f.old!==''?dollars(f.old):null;let compare=old===null?'<span class="muted small">Add an earlier selling price to test the Black Friday claim.</span>':pr>old?`<span style="color:var(--red)">⚠ ${money(pr-old)} HIGHER than your earlier observed price.</span>`:pr<old?`<span style="color:var(--green)">↓ ${money(old-pr)} LOWER than your earlier observed price.</span>`:'<span class="muted">The current price matches the earlier observed price.</span>';const p=PROGRAMS.find(x=>x.id===f.store);const noStack=f.stack==='no'||p?.stack==='no';const conditional=validRate&&pr>0?money(pr-perc):'—';$('calcResult').innerHTML=`<div class="eyebrow">Price transparency</div><div style="margin:14px 0 16px"><span class="small muted">Current retailer price</span><div class="value">${f.price!==''?money(pr):'—'}</div></div><div class="row"><span class="muted small">Veteran discount ${validRate?'('+rate+'%)':''}</span><strong>${validRate&&f.price!==''?'−'+money(perc):'—'}</strong></div><hr class="divide"><span class="small muted">${noStack?'What-if calculation only (not stackable)':'Potential veteran subtotal'}</span><div class="value gold">${conditional}</div><p class="tiny muted">${noStack?'Retailer prohibits combining the veteran program with an existing promotion. Do not rely on the figure above as payable.':f.stack==='yes'?'Assumes the discount is confirmed to apply to this specific product.':'Conditional estimate only; eligibility and stacking are not verified.'}</p><hr class="divide"><div class="small"><b>Earlier price check:</b><br>${compare}</div>${p?.terms?`<p class="tiny muted" style="margin:14px 0 0">${esc(p.name)} restrictions: ${esc(p.terms)}</p>`:''}`;if(f.store){const sel=$('cpStore');if(sel.dataset.prev!==f.store){sel.dataset.prev=f.store; if(p?.rate!==null){$('cpDiscount').value=String(p.rate)}if(p?.stack==='no')$('cpStack').value='no';else $('cpStack').value='unknown';renderCalc();return}}}
function resetCalc(){selectedProduct=null;$('calcForm').reset();$('cpStore').dataset.prev='';renderCalc()}
function findPrices(){const q=$('cpName').value.trim();if(!q){notify('Enter an exact product name to search.');return}window.open('https://www.google.com/search?tbm=shop&q='+encodeURIComponent(q),'_blank','noopener,noreferrer')}
function saveProduct(){const f=calcInput();if(!f.name){notify('Enter a product name first.');$('cpName').focus();return}if(f.price===''||!Number.isFinite(Number(f.price))||Number(f.price)<0){notify('Enter an actual retailer price.');return}if(f.rate!==''&&(Number(f.rate)<0||Number(f.rate)>100)){notify('Discount must be from 0% to 100%.');return}if(f.url&&!safeUrl(f.url)){notify('Use a valid http/https retailer link.');return}const p={id:id(),name:f.name,store:f.store||'',storeName:PROGRAMS.find(p=>p.id===f.store)?.name||'Custom retailer',rate:f.rate===''?null:Number(f.rate),stack:PROGRAMS.find(p=>p.id===f.store)?.stack==='no'?'no':f.stack,url:safeUrl(f.url),notes:f.notes,history:[{at:now(),cents:dollars(f.price),old:f.old!==''?dollars(f.old):null}]};state.products.unshift(p);save();render();notify('Product saved; add new observations as the price changes.')}
function productsHtml(){if(!state.products.length)return `<div class="empty"><div class="big">📉</div><b>No prices recorded yet</b><p>Enter your first product above. Every future price you add creates a real dated observation.</p></div>`;return state.products.map(p=>{let obs=p.history||[],last=obs[obs.length-1],low=Math.min(...obs.map(x=>x.cents));return `<div class="listrow"><div style="min-width:0"><strong>${esc(p.name)}</strong><small>${esc(p.storeName)} · Latest ${money(last.cents)} · ${obs.length} actual log${obs.length===1?'':'s'} · Best recorded ${money(low)}</small><div class="badge-bar"><span class="pill">${p.rate===null?'Discount varies':p.rate+'% entered'}</span>${last.cents>low?'<span class="pill warn">Not your lowest price</span>':''}</div></div><div style="display:flex;gap:7px"><button class="btn small ghost" onclick="openProduct('${p.id}')">History</button><button class="icon-btn" onclick="deleteProduct('${p.id}')" aria-label="Delete product">${icon('trash')}</button></div></div>`}).join('')}
function deleteProduct(pid){if(!confirm('Delete this tracked product and its price history?'))return;state.products=state.products.filter(p=>p.id!==pid);save();render();notify('Product deleted')}
function chartSvg(h){if(h.length<2)return '<div class="quiet">Add at least two dated observations to see the price chart.</div>';let nums=h.map(x=>x.cents),min=Math.min(...nums),max=Math.max(...nums),range=Math.max(1,max-min),pts=nums.map((n,i)=>[25+i*(510/(h.length-1)),160-130*(n-min)/range]);return `<svg viewBox="0 0 560 195" role="img" aria-label="Recorded price history line chart"><path d="M25 12V160H540" stroke="#385069" stroke-width="1" fill="none"/><line x1="25" y1="160" x2="540" y2="160" stroke="#385069" stroke-dasharray="4 4"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#f2bf65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(pt=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="4" fill="#f2bf65"/>`).join('')}<text x="28" y="12" fill="#d7e2f0" font-size="13">${money(max)}</text><text x="28" y="184" fill="#d7e2f0" font-size="13">${money(min)}</text><text x="540" y="184" text-anchor="end" fill="#a4b4cb" font-size="11">${h.length} recorded observations</text></svg>`}
function openProduct(pid){const p=state.products.find(p=>p.id===pid);if(!p)return;let h=p.history||[],low=Math.min(...h.map(x=>x.cents));modal(`<div class="eyebrow">Your saved, dated observations</div><h2>${esc(p.name)}</h2><p class="small muted">${esc(p.storeName)} · ${p.rate===null?'Discount not recorded':p.rate+'% veteran discount entered'} · Stacking ${p.stack}</p><div class="chartbox">${chartSvg(h)}</div><p class="tiny muted">Only values you personally logged appear above. Dates are generated when you record a price; they aren't historical retailer API data.</p><div class="listrow"><div><b>Lowest recorded price</b><small>${h.length} observations</small></div><strong style="color:var(--green)">${money(low)}</strong></div><div style="max-height:190px;overflow:auto">${[...h].reverse().map(e=>`<div class="row" style="padding:7px 0;border-bottom:1px solid #293c51"><span class="tiny muted">${day(e.at)}</span><b>${money(e.cents)}</b></div>`).join('')}</div><hr class="divide"><div class="formgrid"><div class="field"><label>New observed price ($)</label><input id="newPrice" type="number" min="0" step="0.01" placeholder="Price shown now"></div><div class="field"><label>Observation note (optional)</label><input id="newNote" placeholder="e.g. Black Friday sale"></div></div><div class="actions"><button class="btn primary" onclick="addPrice('${p.id}')">${icon('plus')} Record new price</button>${p.url?`<a target="_blank" rel="noopener noreferrer" class="btn ghost" href="${esc(p.url)}">${icon('external')} Open product listing</a>`:''}<button class="btn ghost" onclick="closeModal()">Close</button></div>`)}
function addPrice(pid){const p=state.products.find(p=>p.id===pid),raw=$('newPrice').value;if(!p||raw===''||!Number.isFinite(Number(raw))||Number(raw)<0){notify('Enter a valid nonnegative observed price.');return}p.history.push({at:now(),cents:dollars(raw),notes:$('newNote').value.trim()});save();openProduct(pid);render();notify('New price observation recorded.')}
function reports(){return `<div class="eyebrow">Help close the gaps</div><h1 style="margin:8px 0 4px;letter-spacing:-.03em">Report a deal</h1><p class="subtitle">Found a missing veteran discount, a better price, or an expired offer? Keep a personal report with the details, then export it if you want to share it later.</p><div class="two"><section class="card"><h2 style="margin:0 0 16px">What did you find?</h2><form id="reportForm"><div class="field"><label>Report type</label><select id="reportKind"><option value="missing" ${reportType==='missing'?'selected':''}>Missing veteran discount</option><option value="better" ${reportType==='better'?'selected':''}>Found a better product price</option><option value="expired" ${reportType==='expired'?'selected':''}>Expired or denied discount</option><option value="request" ${reportType==='request'?'selected':''}>Request a new veteran discount</option></select></div><div class="field"><label>Business or store name *</label><input required id="reportMerchant" maxlength="140" placeholder="e.g. local sports shop"></div><div class="formgrid"><div class="field"><label>City / ZIP / online</label><input id="reportLocation" maxlength="120" placeholder="Where is this offered?"></div><div class="field"><label>Discount or current price</label><input id="reportAmount" maxlength="100" placeholder="10% off / $1899.99"></div></div><div class="field"><label>Store policy or product link (optional)</label><input id="reportUrl" type="url" placeholder="https://official-store.com/..."></div><div class="field"><label>Details and how to claim *</label><textarea required id="reportDetails" maxlength="1500" placeholder="How you found it, who qualifies, exclusions, verification method..."></textarea></div><div class="callout">🔒 No account required. This personal version saves the report <b>only in your browser</b>. It is <b>not</b> sent to a public moderator or shared with other veterans. Never paste military IDs, private receipts, or personal records.</div><button class="btn primary" style="margin-top:13px" type="submit">${icon('check')} Save report privately</button></form></section><section><div class="section-head" style="margin-top:0"><h2>My reports</h2><span class="quiet">${state.reports.length} saved</span></div>${state.reports.length?state.reports.map(r=>`<div class="listrow"><div><strong>${esc(r.merchant)}</strong><small>${esc(reportLabel(r.kind))} · ${day(r.at)} · ${esc(r.location)}</small><small>${esc(r.details.slice(0,140))}</small></div><button class="icon-btn" aria-label="Delete report" onclick="deleteReport('${r.id}')">${icon('trash')}</button></div>`).join(''):`<div class="empty"><div class="big">📋</div>No reports saved yet. Your first contribution starts here.</div>`}<div class="actions"><button class="btn ghost" onclick="exportData()">${icon('download')} Export all reports & data</button></div></section></div>`}
function reportLabel(k){return {missing:'Missing discount',better:'Better price',expired:'Expired/denied discount',request:'Request new discount'}[k]||'Report'}
function startReport(t){reportType=t;setView('reports')}
function submitReport(ev){ev.preventDefault();const merchant=$('reportMerchant').value.trim(),details=$('reportDetails').value.trim(),url=$('reportUrl').value.trim();if(!merchant||!details){notify('Store and details are required.');return}if(url&&!safeUrl(url)){notify('Enter a valid http/https store link.');return}state.reports.unshift({id:id(),at:now(),kind:$('reportKind').value,merchant,location:$('reportLocation').value.trim(),amount:$('reportAmount').value.trim(),url:safeUrl(url),details});save();render();notify('Report saved privately on this device')}
function deleteReport(rid){state.reports=state.reports.filter(r=>r.id!==rid);save();render();notify('Report deleted')}
function vault(){let saved=PROGRAMS.filter(p=>state.favorites.includes(p.id));return `<div class="eyebrow">Your personal deal notebook</div><h1 style="margin:8px 0 4px;letter-spacing:-.03em">My Vault</h1><p class="subtitle">Favorite merchants, personal reports and a daily digest you can generate right now. Nothing here requires an account.</p><div class="section-head"><h2>Saved merchants</h2><span class="quiet">${saved.length} saved</span></div>${saved.length?`<div class="grid">${saved.map(programCard).join('')}</div>`:`<div class="empty"><div class="big">♥</div>Tap the heart on any discount to save it here.</div>`}<div class="section-head"><h2>Your Daily Deal Brief</h2></div><div class="two"><section class="card"><div class="row"><div><b>Ready when you are</b><p class="small muted">Create a digest from documented programs and your favorite stores. Copy it or open an email draft.</p></div><span style="font-size:28px">✉️</span></div><div class="field"><label>Include programs</label><select id="digestType"><option value="saved">My saved stores</option><option value="all">All documented programs</option></select></div><div class="actions"><button class="btn primary" onclick="renderDigest()">Create my digest</button><button class="btn ghost" onclick="copyDigest()">Copy text</button><button class="btn ghost" onclick="emailDigest()">Open email draft</button></div><p class="tiny muted">This offline edition cannot send emails automatically at 7 AM. That requires a hosted service, email provider and opt-in/unsubscribe management; no email is requested or stored here.</p></section><section class="card"><div class="eyebrow">Email preview</div><div id="digestOutput" class="codeish"></div></section></div><div class="section-head"><h2>Backup and privacy</h2></div><div class="card"><p class="small muted">Your saved programs, price observations and reports live in this browser's local storage. Export a backup so you don't lose them when clearing Safari data or switching devices.</p><div class="actions"><button class="btn primary" onclick="exportData()">${icon('download')} Download my backup</button><label class="btn ghost" style="cursor:pointer">Restore backup<input type="file" accept=".json,application/json" hidden onchange="importData(event)"></label><button class="btn danger" onclick="clearData()">${icon('trash')} Clear local data</button></div></div>`}
function digestText(){let selected=$('digestType')?.value||'saved',list=selected==='saved'?PROGRAMS.filter(p=>state.favorites.includes(p.id)):PROGRAMS;return `VETERANS DEAL PROOF — PERSONAL DEAL BRIEF\nPrepared ${new Date().toLocaleDateString('en-US')}\n\n${list.length?list.map((p,i)=>`${i+1}. ${p.name} — ${p.offer}\n   Where: ${p.channel}; eligibility and exclusions apply.\n   Verify: ${p.url}`).join('\n\n'):'No saved programs yet. Favorite a retailer first or choose All documented programs.'}\n\nThis digest lists merchant discount PROGRAMS, not live product prices or guaranteed Black Friday deals. Verify all claims and final prices directly with merchants. Veterans Deal Proof is independent and does not sell merchandise.`}
function renderDigest(){if($('digestOutput'))$('digestOutput').textContent=digestText()}
async function copyDigest(){const s=digestText();try{await navigator.clipboard.writeText(s);notify('Digest copied')}catch(e){let a=document.createElement('textarea');a.value=s;document.body.append(a);a.select();document.execCommand('copy');a.remove();notify('Digest copied')}}
function emailDigest(){const s=digestText();window.location.href='mailto:?subject='+encodeURIComponent('Veterans Deal Proof — Personal Deal Brief')+'&body='+encodeURIComponent(s)}
function exportData(){const b=new Blob([JSON.stringify({app:'Veterans Deal Proof',version:1,exportedAt:now(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='Veterans_Deal_Proof_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);notify('Backup downloaded')}
function importData(evt){const f=evt.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);if(obj.app!=='Veterans Deal Proof'||!obj.data||!Array.isArray(obj.data.products)||!Array.isArray(obj.data.reports)||!Array.isArray(obj.data.favorites))throw Error('Invalid backup');if(!confirm('Replace your saved data with this backup?'))return;state={favorites:obj.data.favorites.filter(x=>typeof x==='string').slice(0,500),products:obj.data.products.slice(0,500),reports:obj.data.reports.slice(0,1000),notes:[],digestCategory:'all',zip:String(obj.data.zip||'').slice(0,80)};save();render();notify('Backup restored')}catch(e){notify('This file is not a valid Veterans Deal Proof backup.')}};rd.readAsText(f)}
function clearData(){if(!confirm('Permanently delete all saved deals, reports and your recorded price history on this device? Export a backup first.'))return;state={favorites:[],products:[],reports:[],notes:[],digestCategory:'all',zip:''};save();render();notify('Local data cleared')}
function openLegal(){modal(`<div class="eyebrow">Independent personal-use website</div><h2>Accuracy, privacy & terms</h2><p class="small muted"><b>Not a retailer.</b> Veterans Deal Proof is a research and personal note-taking tool. It does not sell, ship, process payments or provide official military eligibility verification. All purchases are made directly with stores.</p><p class="small muted"><b>No government affiliation.</b> This is not a product of the U.S. Department of Veterans Affairs, Department of Defense or any government body. Retailer trademarks are owned by their respective companies; inclusion is not an endorsement or partnership.</p><p class="small muted"><b>Price calculations.</b> Entered item prices and discount percentages are not verified automatically. Estimates exclude taxes, shipping, eligibility restrictions, item exclusions, annual discount caps and whether discounts can combine. The retailer’s final checkout total controls.</p><p class="small muted"><b>Merchant data.</b> The starting directory was researched against official program pages on ${TODAY}. Programs can change at any time. Links point to official merchant sources; no private pricing was copied from membership areas. Any absence of a store does not prove it offers no discount.</p><p class="small muted"><b>Privacy.</b> In this personal edition, favorites, tracked prices and reports are stored locally using your browser. No signup, newsletter subscriptions, DD-214s, military IDs or location data are transmitted to us. External retailer or map links follow those providers’ own policies. Clearing browser storage can erase your notes, so export a backup.</p><p class="small muted"><b>No automated newsletter.</b> The digest tool prepares an email draft on your device; it does not automatically mail at 7 AM. Automated delivery will require a compliant hosted service with confirmed opt-in and unsubscribe support.</p><p class="small muted"><b>Legal status.</b> This is a personal prototype, not legal clearance for public nationwide deployment. Public launch requires attorney review, permitted merchant-data licenses, community moderation, production privacy and security controls, and branding clearance.</p><button class="btn primary" onclick="closeModal()">I understand</button>`)}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body></html>
